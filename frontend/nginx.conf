server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không trùng file tĩnh đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dài cho asset có hash Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
