server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không trùng file tĩnh đều trả index.html
    # HTML phải KHÔNG BAO GIỜ được cache lâu: bundle đổi hash mỗi build,
    # nếu trình duyệt giữ index.html cũ thì tham chiếu asset cũ -> lỗi/trắng trang.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API về backend gateway trong mạng compose
    # (trước đây thiếu block này -> /api/* rơi vào SPA fallback và trả index.html,
    #  khiến mọi lời gọi API từ trang :8501 nhận HTML thay vì JSON)
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Nén các payload văn bản lớn (bundle JS, CSV dataset)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/csv text/plain;

    # Cache dài cho asset có hash Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Dataset lịch sử khá nặng (~620KB) - cho phép trình duyệt cache 1 ngày
    # và ép Content-Type text/csv để gzip_types áp dụng được
    location = /sale_dataset_ver_2.csv {
        default_type text/csv;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
