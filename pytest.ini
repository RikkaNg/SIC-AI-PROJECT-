[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# Custom markers
markers =
    api: API endpoint tests (Mục 4.3)
    security: Security tests (Mục 4.4)
    performance: Performance/P95 tests
    edge: Edge case tests (input bất thường)
    ml: ML Service tests (:8001)
    llm: LLM Agent tool tests (qua /api/chat)
    slow: Tests chạy lâu (LLM chat)
    integration: Tests cần hệ thống đầy đủ đang chạy

# Timeout per test (seconds) - cần pytest-timeout
# timeout = 60
